[project]
name = "invoicelens"
version = "0.3.0"
description = "Invoice intake pipeline: OCR, extraction, validation, measured accuracy."
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "pillow>=10",
    "numpy>=1.26",
    "reportlab>=4",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2",
    "rq>=2.0",
    "redis>=5",
    "boto3>=1.35",
    "prometheus-client>=0.21",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3",
    "httpx>=0.27",  # tools/load_demo.py
    "httpx2>=2",  # starlette TestClient
    "moto[s3]>=5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and form fields as default values; that is the intended use.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "tools*", "eval*"]

[tool.setuptools.package-data]
"app.service" = ["templates/*.html"]
